# 5Gone Phase 2 — RAR DoS attacker config
# Aligned with config/srsran/gnb_20mhz.yml (n78, 20 MHz, PCI 1, 23.04 MSPS)

mode: sim  # sim | inject | live | bus

dry_run: false

radio:
  sample_rate: 23040000
  center_freq_hz: 3500000000  # adjust to match dl_arfcn 632628 in your band plan
  tx_gain: 80
  rx_gain: 40
  # Second B210 serial — gNB uses the first device
  device_args: "type=b200,master_clock_rate=23.04e6,num_recv_frames=512,num_send_frames=512"

cell:
  pci: 1
  scs_khz: 30
  bandwidth_mhz: 20
  band: 78
  dl_arfcn: 632628

attack:
  # Measured B210 cross-chain near-field loopback latency (Step 4): +7.5 µs.
  # TX must emit EARLY by this amount so the burst lands exactly on target.
  symbol_advance_us: 8   # from loopback harness avg delay
  tx_power_scale: 1.5      # relative IQ scale before PA

# Step 4 — loopback timing harness (single B210). Port map:
#   TX/RX A = chain A switched TX port  -> TX (antenna 1)
#   TX/RX B = chain B switched RX port  -> RX (antenna 2)
#   RX2 A / RX2 B = RX-only alternate inputs on each chain (cabled loopback).
# Two antenna options:
#   (A) Near-field: antennas on TX/RX A AND TX/RX B, tips <=3 cm apart.
#       -> rx_subdev "A:B" + rx_antenna "TX/RX"  (this config)
#   (B) Cabled: SMA TX/RX A -> RX2 A (same chain). Then use
#       rx_subdev "A:A" + rx_antenna "RX2", tx_gain: 0, rx_gain: 20.
# After a pass, set attack.symbol_advance_us to the measured avg delay.
loopback:
  iterations: 3
  window_ms: 200
  tx_subdev: "A:A"    # TX on TX/RX A (antenna 1)
  rx_subdev: "A:B"    # RX on TX/RX B (antenna 2) — cross-chain near-field
  tx_antenna: "TX/RX"
  rx_antenna: "TX/RX"
  tx_scale: 5.0      # scale applied to the TX marker burst (boost near-field RX)
  probe: false        # run TX RF/RSSI probe stages (set false for fast re-runs)
  # dump_path: /tmp/lb0.cf32   # set to write iter-0 RX window for offline inspection

paths:
  iq_template_dir: phase2/iq_templates
  grant_file: phase2/config/sample_grant.json
  dataset_dir: data/5gone-dataset
  log_file: /tmp/5gone_attacker.log
  grant_bus: /tmp/5gone_grants.jsonl

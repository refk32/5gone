# 5Gone Phase 2 — RAR DoS attacker config
# Aligned with config/srsran/gnb_20mhz.yml (n78, 20 MHz, PCI 1, 23.04 MSPS)

mode: sim  # sim | inject | live | bus

dry_run: false

radio:
  sample_rate: 23040000
  center_freq_hz: 3500000000  # adjust to match dl_arfcn 632628 in your band plan
  tx_gain: 80
  rx_gain: 40
  # Second B210 serial — gNB uses the first device
  device_args: "type=b200,master_clock_rate=23.04e6,num_recv_frames=512,num_send_frames=512"

cell:
  pci: 1
  scs_khz: 30
  bandwidth_mhz: 20
  band: 78
  dl_arfcn: 632628

attack:
  symbol_advance_us: 500   # B210 USB target; paper X310 ~672–2287 µs
  tx_power_scale: 1.5      # relative IQ scale before PA

paths:
  iq_template_dir: phase2/iq_templates
  grant_file: phase2/config/sample_grant.json
  dataset_dir: data/5gone-dataset
  log_file: /tmp/5gone_attacker.log
  grant_bus: /tmp/5gone_grants.jsonl
